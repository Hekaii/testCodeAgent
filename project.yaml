project:
  key: test-code-agent
  name: test-code-agent
  description: simulated paper training project for AIRunning end-to-end testing
  defaultBranch: main

runtime:
  preferredOs: linux
  pythonVersion: "3.11"
  useConda: false
  condaEnvName: ""
  useDocker: false

checkout:
  fetchSubmodules: false
  lfs: false

prepare:
  linux:
    - "python scripts/run_experiment.py --mode dry-run --config configs/experiment.json --data-dir data/raw --output outputs/reports/final_metrics.csv"
  windows:
    - "python scripts/run_experiment.py --mode dry-run --config configs/experiment.json --data-dir data/raw --output outputs/reports/final_metrics.csv"

baseline:
  linux:
    - "python scripts/run_experiment.py --mode baseline --config configs/experiment.json --data-dir data/raw --output outputs/reports/final_metrics.csv"
  windows:
    - "python scripts/run_experiment.py --mode baseline --config configs/experiment.json --data-dir data/raw --output outputs/reports/final_metrics.csv"

train:
  linux:
    - "python scripts/run_experiment.py --mode train --config configs/experiment.json --data-dir data/raw --output outputs/reports/final_metrics.csv"
  windows:
    - "python scripts/run_experiment.py --mode train --config configs/experiment.json --data-dir data/raw --output outputs/reports/final_metrics.csv"

validate:
  linux:
    - "python -m compileall train scripts"
  windows:
    - "python -m compileall train scripts"

metrics:
  primaryMetric: score
  parserType: csv_file
  parserTarget: outputs/reports/final_metrics.csv
  goalExpression: "score >= 0.90"
  extraRules:
    - "train_val_gap <= 0.03"
    - "loss_std_last5 <= 0.01"
    - "best_epoch <= 10"

artifacts:
  include:
    - "outputs/**"
    - "logs/**"
    - "configs/**"

git:
  pushBranchPattern: "exp/{projectKey}/{runId}"
  commitMessageTemplate: "feat(auto-opt): run {runId} iteration {iteration}"
